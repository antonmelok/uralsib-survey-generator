<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор опросов | Уралсиб</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>Генератор опросов Уралсиб</h1>
            <p>Анализ клиентского пути с помощью Llama 3.1</p>
        </div>
    </header>

    <main class="container">
        <div class="grid">
            <section class="card">
                <h2>Новый опрос</h2>
                <div class="form-group">
                    <label>Путь клиента (JSON или текст)</label>
                    <textarea id="journeyInput" placeholder='Пришел в банк...'></textarea>
                    <small>Максимум 10000 символов</small>
                </div>
                <div class="form-group">
                    <label>Подсказка (необязательно)</label>
                    <input type="text" id="hintInput" placeholder="Например: Клиент оформлял РКО">
                </div>
                <button id="generateBtn">Сгенерировать</button>
            </section>

            <section class="card" id="resultSection" style="display: none;">
                <h2>Результат генерации</h2>
                <div class="badges">
                    <span class="badge" id="resCategory">Категория</span>
                    <span class="badge" id="resRelevance">Релевантность</span>
                </div>
                <ul id="resQuestions" class="questions-list"></ul>
                <button id="saveEditBtn" class="btn-secondary">Сохранить правки</button>
            </section>
        </div>

        <section class="card full-width">
            <div class="flex-between">
                <h2>История опросов</h2>
                <a href="/api/surveys/export/csv" class="btn-secondary">Экспорт CSV</a>
            </div>
            <div id="historyList" class="history-grid"></div>
        </section>
    </main>

    <!-- Модальное окно редактирования -->
    <div id="editModal" class="modal" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Редактирование опроса</h3>
                <button onclick="closeEditModal()" class="close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Категория</label>
                    <input type="text" id="editCategory">
                </div>
                <div class="form-group">
                    <label>Релевантность (0.0 - 1.0)</label>
                    <input type="number" id="editRelevance" step="0.01" min="0" max="1">
                </div>
                <div class="form-group">
                    <label>Вопросы (каждый с новой строки)</label>
                    <textarea id="editQuestions" rows="8"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button onclick="closeEditModal()" class="btn-secondary">Отмена</button>
                <button onclick="saveEditFromModal()" class="btn-primary">Сохранить</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
